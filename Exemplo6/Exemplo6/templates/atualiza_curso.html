{% extends 'base.html' %}
{% block conteudo %}
<h2 style="text-align: center;">Cadastrar curso</h2>
<hr/>
<form action="{{url_for('atualizar_curso', id_curso=curso.id_curso)}}" method="POST" class="form-control">
    <label for="nome">Nome:</label>
    <input type="text" class="form-control" value="{{curso.nome}}" name="nome" required/>
    <label for="descricao">Descrição:</label>
    <input type="text" class="form-control" name="descricao" value="{{curso.descricao}}"required/>
    <label for="cargahoraria">Carga Horária:</label>
    <input type="text" class="form-control" name="cargahoraria" value="{{curso.cargahoraria}}"required/>
    <button class="btn btn-success">Salvar</button>
</form>
{% endblock conteudo %}
